<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣 |即時氣象儀表板</title>
    <meta name="description" content="台灣主要城市即時天氣資訊，包含溫度、濕度與降雨機率。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons for weather icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-anim"></div>
    <main class="container">
        <header>
            <h1>台灣即時天氣</h1>
            <p id="last-updated">更新中...</p>
        </header>

        <div class="weather-grid" id="weather-grid">
            <!-- Weather cards will be injected here by JS -->
            <div class="loading">載入天氣資訊中...</div>
        </div>

        <section class="windy-section">
            <h2 class="section-title">即時地圖、空氣品質與影像</h2>
            <div class="windy-grid">
                <div class="windy-card">
                    <h3>即時風場與天氣</h3>
                    <iframe width="100%" height="450" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=6&overlay=wind&product=ecmwf&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
                </div>
                <div class="windy-card">
                    <h3>空氣品質 (PM2.5)</h3>
                    <iframe width="100%" height="450" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=6&overlay=pm2p5&product=cams&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
                </div>
                <div class="windy-card">
                    <h3>天氣雷達與衛星雲圖</h3>
                    <iframe width="100%" height="450" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=6&overlay=radar&product=radar&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
