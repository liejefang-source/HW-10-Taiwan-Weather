<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣 |即時氣象儀表板</title>
    <meta name="description" content="台灣主要城市即時天氣資訊，包含溫度、濕度與降雨機率。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons for weather icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-anim"></div>
    <main class="container">
        <header>
            <h1>台灣即時天氣與風場預測</h1>
            <p id="last-updated">更新中...</p>
        </header>

        <!-- Top Dashboard Layout -->
        <div class="dashboard-layout">
            <!-- Large Windy Map -->
            <div class="map-container">
                <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=7&overlay=wind&product=ecmwf&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
            </div>

            <!-- Weather Table -->
            <div class="weather-table-container">
                <table class="weather-table">
                    <thead>
                        <tr>
                            <th>城市</th>
                            <th>天氣</th>
                            <th>溫度</th>
                            <th>降雨</th>
                        </tr>
                    </thead>
                    <tbody id="weather-tbody">
                        <tr>
                            <td colspan="4" class="loading">載入天氣資訊中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <section class="windy-section">
            <h2 class="section-title">中央氣象署觀測圖與空氣品質</h2>
            <div class="windy-grid">
                <div class="windy-card">
                    <h3>空氣品質 (PM2.5)</h3>
                    <iframe width="100%" height="450" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=6&overlay=pm2p5&product=cams&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
                </div>
                <div class="windy-card">
                    <h3>中央氣象署 - 雷達回波圖</h3>
                    <div class="cwa-iframe-wrapper">
                        <iframe src="https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html" frameborder="0" scrolling="no"></iframe>
                    </div>
                </div>
                <div class="windy-card">
                    <h3>中央氣象署 - 衛星雲圖</h3>
                    <div class="cwa-iframe-wrapper">
                        <iframe src="https://www.cwa.gov.tw/V8/C/W/OBS_Sat.html" frameborder="0" scrolling="no"></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
