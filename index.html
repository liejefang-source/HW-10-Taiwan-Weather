<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣 |即時氣象儀表板</title>
    <meta name="description" content="台灣主要城市即時天氣資訊，包含溫度、濕度與降雨機率。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons for weather icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-anim"></div>
    <main class="container">
        <header>
            <h1>台灣即時天氣與風場預測</h1>
            <p id="last-updated">更新中...</p>
        </header>

        <!-- Top Dashboard Layout: Weather -->
        <div class="dashboard-layout">
            <!-- Large Windy Map (Wind) -->
            <div class="map-container">
                <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=7&overlay=wind&product=ecmwf&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
            </div>

            <!-- Weather Table -->
            <div class="weather-table-container">
                <h3 class="table-title">各地基本氣象</h3>
                <table class="weather-table">
                    <thead>
                        <tr>
                            <th>城市</th>
                            <th>天氣</th>
                            <th>溫度</th>
                            <th>降雨</th>
                        </tr>
                    </thead>
                    <tbody id="weather-tbody">
                        <tr>
                            <td colspan="4" class="loading">載入天氣資訊中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bottom Dashboard Layout: Satellite -->
        <div class="dashboard-layout">
            <!-- Large Windy Map (Satellite) -->
            <div class="map-container">
                <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=6&overlay=satellite&product=satellite&level=surface&lat=23.697&lon=120.960" frameborder="0"></iframe>
            </div>

            <!-- Details Table -->
            <div class="weather-table-container">
                <h3 class="table-title">進階觀測數據</h3>
                <table class="weather-table">
                    <thead>
                        <tr>
                            <th>城市</th>
                            <th>相對濕度</th>
                            <th>風速</th>
                            <th>體感溫度</th>
                        </tr>
                    </thead>
                    <tbody id="details-tbody">
                        <tr>
                            <td colspan="4" class="loading">載入進階資訊中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
    <script src="app.js"></script>
</body>
</html>
